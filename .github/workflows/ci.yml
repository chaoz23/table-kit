name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install contract validation tooling
        run: python -m pip install "jsonschema>=4.18"
      - name: Tests (runtime remains dependency-free)
        run: python -m unittest discover -s tests -v
      - name: Generated contract artifacts are current
        run: python scripts/generate_contract_types.py --check
      - name: The demo session runs and reports its own defects
        run: |
          set +e
          python3 examples/demo_session.py > /tmp/demo.txt
          code=$?
          set -e
          cat /tmp/demo.txt
          test $code -eq 1 || { echo "demo should exit 1 (it contains defects on purpose), got $code"; exit 1; }
          grep -q "undeliverable_cue" /tmp/demo.txt
          grep -q "seat_quiet" /tmp/demo.txt
      - name: The table is never given a command syntax
        run: |
          ! tablekit schema | grep -q '"!'
          ! grep -rEn '"!(huh|wait|yes|drag|mine|off)' README.md llms.txt tool.json docs/QUICKSTART.md

      - name: The cause is reported before the symptom it caused
        run: |
          cause=$(grep -n "undeliverable_cue" /tmp/demo.txt | head -1 | cut -d: -f1)
          symptom=$(grep -n "seat_quiet" /tmp/demo.txt | head -1 | cut -d: -f1)
          test "$cause" -lt "$symptom" || {
            echo "the undeliverable cue must be reported above the silence it caused"; exit 1; }
      - name: Wheel and sdist preserve the tested contract
        run: |
          pip install build && python -m build
          sdist_dir=$(mktemp -d)
          tar -xzf dist/tablekit-*.tar.gz -C "$sdist_dir"
          (cd "$sdist_dir"/tablekit-* && python -m unittest discover -s tests -v)
          pip install dist/*.whl
          tablekit --version
          tablekit schema > /dev/null
          tablekit contract evaluation > /dev/null
          tablekit contract event > /dev/null
          tablekit contract golden > /dev/null
          tablekit debrief > /dev/null
          printf '%s\n' '{"ts":1.0,"type":"event","actor":"GM","text":"Begin."}' > /tmp/legacy.jsonl
          tablekit migrate-events --ledger /tmp/legacy.jsonl --campaign ci --session cold-wheel --out /tmp/events.jsonl > /tmp/migration.json
          grep -q '"authority_status": "self_attested"' /tmp/migration.json
          grep -q '"schema_version":"table.event/1.0"' /tmp/events.jsonl

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Listener and engine parse
        run: |
          node --check transport/discord/gateway.mjs
          node --check transport/discord/listen.mjs
          node --check engine/story.mjs
          node --check engine/move.mjs
          node --check engine/game.cjs
          node --check engine/server.cjs
      - name: Discord Gateway state-machine tests
        run: node --test tests/test_discord_gateway.mjs
      - name: Listener refuses to start without a token
        run: |
          cat > /tmp/t.json <<'JSON'
          {"name":"t","seats":[{"id":"a"}],"transport":{"channel_id":"1","token_env":"NOPE_TOKEN"}}
          JSON
          set +e
          node transport/discord/listen.mjs /tmp/t.json 2>/tmp/err.txt
          test $? -eq 2 || { echo "expected exit 2"; exit 1; }
          grep -q "NOPE_TOKEN" /tmp/err.txt

  portfolio-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out table-kit candidate
        uses: actions/checkout@v5
        with:
          path: table-kit-src
      - name: Check out pinned dmcheck candidate
        uses: actions/checkout@v5
        with:
          repository: chaoz23/dmcheck
          ref: ce7ce6f3959227c7db86e3264fd6c5aecda80a48
          path: dmcheck-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build both candidate wheels
        run: |
          python -m pip install build
          mkdir wheels
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/wheels" table-kit-src
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/wheels" dmcheck-src
      - name: Cold-install and run portfolio conformance
        run: |
          python -m venv "$RUNNER_TEMP/portfolio-conformance"
          "$RUNNER_TEMP/portfolio-conformance/bin/python" -m pip install jsonschema
          "$RUNNER_TEMP/portfolio-conformance/bin/python" -m pip install \
            --no-index --find-links "$GITHUB_WORKSPACE/wheels" tablekit dmcheck
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/portfolio-conformance/bin/python" \
            "$GITHUB_WORKSPACE/table-kit-src/scripts/check_dmcheck_conformance.py" \
            --tablekit "$RUNNER_TEMP/portfolio-conformance/bin/tablekit" \
            --dmcheck "$RUNNER_TEMP/portfolio-conformance/bin/dmcheck"

  srdcheck-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out table-kit candidate
        uses: actions/checkout@v5
        with:
          path: table-kit-src
      - name: Check out pinned srdcheck candidate
        uses: actions/checkout@v5
        with:
          repository: chaoz23/srdcheck
          ref: 28f765572105a40a5ba862c27b0286d4982dde59
          path: srdcheck-src
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build both candidate wheels
        run: |
          python -m pip install build
          mkdir wheels
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/wheels" table-kit-src
          python -m build --wheel --outdir "$GITHUB_WORKSPACE/wheels" srdcheck-src
      - name: Cold-install and run srdcheck conformance
        run: |
          python -m venv "$RUNNER_TEMP/srdcheck-conformance"
          "$RUNNER_TEMP/srdcheck-conformance/bin/python" -m pip install jsonschema
          "$RUNNER_TEMP/srdcheck-conformance/bin/python" -m pip install \
            --no-index --find-links "$GITHUB_WORKSPACE/wheels" tablekit srdcheck
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/srdcheck-conformance/bin/python" \
            "$GITHUB_WORKSPACE/table-kit-src/scripts/check_srdcheck_conformance.py" \
            --tablekit "$RUNNER_TEMP/srdcheck-conformance/bin/tablekit" \
            --srdcheck "$RUNNER_TEMP/srdcheck-conformance/bin/srdcheck"
